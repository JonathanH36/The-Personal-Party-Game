<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Personal Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12111a;
  --panel:#1c1a29;
  --panel-raised:#252236;
  --coral:#ff5d6c;
  --gold:#ffc857;
  --mint:#5ee6c4;
  --violet:#8d7bf0;
  --paper:#f3efe6;
  --line: rgba(243,239,230,0.12);
  --text: #f3efe6;
  --text-dim: rgba(243,239,230,0.62);
  --radius: 18px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: radial-gradient(120% 140% at 15% -10%, #241f3a 0%, var(--ink) 45%), var(--ink);
  color: var(--text);
  font-family:'Space Grotesk', system-ui, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Fraunces', Georgia, serif;
  font-weight:700;
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom: 90px;
}
/* device switcher — the signature element: a row of phone "badges" you tap to become that player */
.device-bar{
  position:sticky; top:0; z-index:50;
  background: rgba(18,17,26,0.92);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
.device-bar-label{
  font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
  color: var(--text-dim); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
}
.device-strip{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none;
}
.device-strip::-webkit-scrollbar{display:none;}
.device-chip{
  flex:0 0 auto;
  display:flex; align-items:center; gap:6px;
  background: var(--panel);
  border:1px solid var(--line);
  border-radius: 999px;
  padding:7px 12px 7px 8px;
  font-size:13px; font-weight:600;
  color: var(--text-dim);
  cursor:pointer;
  white-space:nowrap;
  transition: all .15s ease;
}
.device-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.device-chip.active{
  background: var(--coral);
  color: var(--ink);
  border-color: var(--coral);
}
.device-chip.active .dot{background:var(--ink);}
.device-chip .host-tag{
  font-size:9px; text-transform:uppercase; letter-spacing:0.06em;
  background: rgba(0,0,0,0.25); padding:1px 5px; border-radius:5px;
}
.device-chip.active .host-tag{ background: rgba(0,0,0,0.15); }

.screen{ padding: 22px 20px 20px; flex:1; display:flex; flex-direction:column; gap:16px; }
.eyebrow{
  font-size:11px; text-transform:uppercase; letter-spacing:0.14em;
  color: var(--gold); font-weight:600;
}
.card{
  background: var(--panel);
  border:1px solid var(--line);
  border-radius: var(--radius);
  padding:18px;
}
.card.raised{ background: var(--panel-raised); }
.muted{ color: var(--text-dim); font-size:14px; line-height:1.5; }
input[type=text], input[type=number], textarea{
  width:100%;
  background: var(--ink);
  border:1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding:12px 14px;
  font-family:inherit;
  font-size:15px;
  resize:vertical;
}
textarea{min-height:70px;}
input:focus, textarea:focus, button:focus-visible{
  outline:2px solid var(--mint); outline-offset:2px;
}
label.field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--text-dim); font-weight:600; }
button{
  font-family:inherit; font-weight:700; font-size:15px;
  border:none; border-radius: var(--radius-sm);
  padding:13px 18px;
  cursor:pointer;
  transition: transform .08s ease, filter .12s ease;
}
button:active{ transform: scale(0.98); }
button.primary{ background: var(--coral); color: var(--ink); }
button.primary:hover{ filter:brightness(1.08); }
button.secondary{ background: transparent; color: var(--text); border:1px solid var(--line); }
button.ghost{ background: transparent; color: var(--text-dim); border:1px dashed var(--line); }
button:disabled{ opacity:0.35; cursor:not-allowed; }
.btn-row{ display:flex; gap:10px; }
.btn-row button{ flex:1; }

.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.switch{ position:relative; width:46px; height:26px; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{
  position:absolute; inset:0; background: var(--panel-raised); border:1px solid var(--line);
  border-radius:999px; cursor:pointer; transition:.15s;
}
.switch .track:before{
  content:""; position:absolute; width:18px; height:18px; left:3px; top:3px;
  background: var(--text-dim); border-radius:50%; transition:.15s;
}
.switch input:checked + .track{ background: var(--coral); border-color:var(--coral); }
.switch input:checked + .track:before{ transform: translateX(20px); background: var(--ink); }

.player-list{ display:flex; flex-direction:column; gap:8px; }
.player-row{
  display:flex; align-items:center; justify-content:space-between;
  background: var(--panel-raised); border-radius: var(--radius-sm); padding:10px 12px;
  font-weight:600; font-size:14px;
}
.player-row .score{ color: var(--mint); font-family:'Space Grotesk'; }
.pill{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700;
  background: var(--violet); color:var(--ink); padding:2px 8px; border-radius:999px;
  text-transform:uppercase; letter-spacing:0.04em;
}

.round-banner{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
}
.round-banner .count{ font-size:13px; color:var(--text-dim); font-weight:600; }

.prompt-text{ font-family:'Fraunces', serif; font-size:22px; line-height:1.3; font-weight:600; }

.option-grid{ display:flex; flex-direction:column; gap:10px; }
.option-btn{
  width:100%; text-align:left;
  background: var(--panel-raised);
  border:1px solid var(--line);
  border-radius: var(--radius-sm);
  padding:16px;
  font-size:16px; font-weight:600;
  color: var(--text);
}
.option-btn.picked{ background: var(--coral); color:var(--ink); border-color:var(--coral); }
.option-btn .tag{
  display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
  color: var(--text-dim); margin-bottom:4px; font-weight:700;
}
.option-btn.picked .tag{ color: rgba(18,17,26,0.6); }

.answer-slot{
  background: var(--panel-raised); border:1px solid var(--line); border-radius: var(--radius-sm);
  padding:14px; font-size:15px; cursor:pointer;
}
.answer-slot.picked{ border-color: var(--mint); box-shadow:0 0 0 2px var(--mint) inset; }
.answer-slot.correct{ border-color: var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
.answer-slot .author{ font-size:12px; color:var(--mint); margin-top:6px; font-weight:600; }

.waiting{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:40px 10px; text-align:center; color: var(--text-dim);
}
.waiting .spinner{
  width:34px; height:34px; border-radius:50%;
  border:3px solid var(--line); border-top-color: var(--coral);
  animation: spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.timer-badge{
  font-variant-numeric: tabular-nums; font-weight:700; font-size:13px;
  background: var(--panel-raised); color: var(--gold);
  border-radius:999px; padding:5px 12px; display:inline-flex; gap:6px; align-items:center;
}

.score-flash{
  font-family:'Fraunces', serif; font-size:15px;
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius: var(--radius-sm);
  background: rgba(94,230,196,0.12); border:1px solid rgba(94,230,196,0.35); color: var(--mint);
}
.score-flash.negative{
  background: rgba(255,93,108,0.12); border-color: rgba(255,93,108,0.35); color: var(--coral);
}

.field-strip{ display:flex; flex-wrap:wrap; gap:6px; }
.field-chip{
  font-size:11px; padding:4px 9px; border-radius:999px;
  background: var(--panel-raised); color: var(--text-dim); border:1px solid var(--line);
}
.field-chip.done{ color: var(--mint); border-color: rgba(94,230,196,0.4); }
.field-chip.current{ color: var(--gold); border-color: rgba(255,200,87,0.5); }

.story-read{ font-family:'Fraunces', serif; font-size:19px; line-height:1.6; }
.story-read .blank{ color: var(--gold); font-weight:700; }

.footer-note{ font-size:12px; color: var(--text-dim); text-align:center; padding:10px 0 0; }

.top-bar-lobby{ display:flex; align-items:center; justify-content:space-between; }
.code-badge{
  font-family:'Space Grotesk'; font-weight:700; letter-spacing:0.08em;
  background: var(--panel-raised); padding:6px 12px; border-radius:999px; font-size:13px;
}
</style>
</head>
